
name: Build FLM BOOST V1.4 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FLM-BOOST-V1.4/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FLM-BOOST-V1.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-V1.4-APK
          path: FLM-BOOST-V1.4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
