
name: FLM BOOST V1.4 Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'FLM-BOOST-V1.4/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project
        shell: bash
        run: |
          set -e
          ls -la FLM-BOOST-V1.4
          test -f FLM-BOOST-V1.4/settings.gradle
          test -f FLM-BOOST-V1.4/build.gradle
          test -f FLM-BOOST-V1.4/app/build.gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: FLM-BOOST-V1.4
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            echo "===== BUILD ERRORS ====="
            grep -n -E \
              'FAILURE:|What went wrong|Execution failed|error:|Caused by:' \
              "$RUNNER_TEMP/build.log" || true
            echo "===== LAST 100 LINES ====="
            tail -n 100 "$RUNNER_TEMP/build.log"
          fi

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-Build-Logs
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-V1.4-APK
          path: FLM-BOOST-V1.4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
