
name: Extract FLM BOOST V1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p /tmp/flm-extract
          unzip -o "$ZIP" -d /tmp/flm-extract

          # Copy extracted files to repository
          cp -a /tmp/flm-extract/. ./

          echo "Extraction completed"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract FLM BOOST V1.4 source"
            git push
          fi
